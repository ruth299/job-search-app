<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melbourne JobDash - Live Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Melbourne JobDash</h1>
            <p>Your Real-Time Professional Career Pipeline</p>
        </div>
    </header>

    <main class="container">
        <!-- Add New Job Form -->
        <section class="form-section">
            <h2>Track a New Application</h2>
            <form id="job-form">
                <input type="text" id="form-role" placeholder="Job Title (e.g., Delivery Lead)" required>
                <input type="text" id="form-company" placeholder="Company (e.g., Melbourne Corp)" required>
                <input type="text" id="form-location" placeholder="Location (e.g., Richmond, VIC)" required>
                <select id="form-status">
                    <option value="Applied">Applied</option>
                    <option value="Interviewing">Interviewing</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
                </select>
                <button type="submit">Add to Board</button>
            </form>
        </section>

        <!-- Live Kanban Board -->
        <section class="board-section">
            <h2>Live Tracking Board</h2>
            <div class="kanban-board">
                <!-- Applied Column -->
                <div class="kanban-column" id="col-applied">
                    <div class="column-header h-applied">Applied <span class="badge" id="count-applied">0</span></div>
                    <div class="card-container" id="list-applied"></div>
                </div>

                <!-- Interviewing Column -->
                <div class="kanban-column" id="col-interviewing">
                    <div class="column-header h-interviewing">Interviewing <span class="badge" id="count-interviewing">0</span></div>
                    <div class="card-container" id="list-interviewing"></div>
                </div>

                <!-- Offer Column -->
                <div class="kanban-column" id="col-offer">
                    <div class="column-header h-offer">Offer <span class="badge" id="count-offer">0</span></div>
                    <div class="card-container" id="list-offer"></div>
                </div>

                <!-- Rejected Column -->
                <div class="kanban-column" id="col-rejected">
                    <div class="column-header h-rejected">Rejected <span class="badge" id="count-rejected">0</span></div>
                    <div class="card-container" id="list-rejected"></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Melbourne JobDash. Stored locally via your browser for live persistent tracking.</p>
    </footer>

    <script src="jobs.js"></script>
</body>
</html>
